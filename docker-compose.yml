# Production stack: Caddy (automatic HTTPS) → nginx → php-fpm, plus queue worker,
# scheduler, Reverb (realtime websockets), PostgreSQL and MinIO (private S3 for
# photos, tickets and backups).
#
# First deploy on a fresh server:   ./deploy.sh init <domain> <your-email>
# Every later update:               ./deploy.sh            (git pull + rebuild + migrate)
# See docs/DEPLOY.md.
x-app: &app
  build: { context: ., target: app }
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-familyhub}
    DB_USERNAME: ${DB_USERNAME:-familyhub}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    FAMILYHUB_FILES_DISK: s3
    FAMILYHUB_BACKUP_DISK: s3
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    AWS_BUCKET: ${AWS_BUCKET:-familyhub}
    # The app publishes realtime signals to the internal Reverb service;
    # browsers connect through Caddy (REVERB_PUBLIC_* in .env).
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  web:
    build: { context: ., target: web }
    depends_on: [app]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, reverb]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-familyhub}
      POSTGRES_USER: ${DB_USERNAME:-familyhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-familyhub}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    volumes: [minio:/data]
    ports: ["127.0.0.1:9001:9001"] # admin console reachable only through an SSH tunnel
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS}
      && mc mb --ignore-existing local/$${BUCKET} && mc anonymous set none local/$${BUCKET}"
    environment:
      MINIO_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_PASS: ${AWS_SECRET_ACCESS_KEY}
      BUCKET: ${AWS_BUCKET:-familyhub}

volumes:
  pgdata:
  minio:
  storage:
  caddy_data:
  caddy_config:
