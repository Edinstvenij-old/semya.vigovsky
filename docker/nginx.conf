# Family Hub — nginx in front of php-fpm.
# For production put TLS in front (Caddy / Traefik / certbot) and consider
# enabling auth_basic below as a second lock that hides the site entirely.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 110m;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # auth_basic "Family Hub";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location = /robots.txt { allow all; auth_basic off; }
    location = /up { auth_basic off; try_files $uri /index.php?$query_string; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}
